name: Build Docker Image

# Publishing a GitHub release builds the image from the repository's Dockerfile at the release's tag
# and publishes it as ghcr.io/<owner>/iam. The tag must be a version (v1.2.3): the image is tagged
# 1.2.3, 1.2 and latest. A pre-release (the release marked as one, or a tag such as v1.2.3-rc.1)
# gets only its own version.
#
# Repository secret needed: REPO_READ_TOKEN, a token that can read the repositories the build
# downloads (srv-core, contract-proto, web-ui, web-sdk). The workflow's own token cannot.

# A saved draft starts nothing.
on:
  release:
    types:
      - published

jobs:
  # Each architecture is built on a runner of its own kind: emulating one is far too slow for a
  # Rust release build. Each pushes an untagged image; `publish` joins them.
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      # A registry name is lower case; the owner's name may not be.
      - name: Name the image
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/iam" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: BUILD_SHA=${{ github.sha }}
          secrets: GIT_AUTH_TOKEN=${{ secrets.REPO_READ_TOKEN }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      # The digest is passed on as an empty file named after it.
      - name: Save the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the image
    runs-on: ubuntu-latest
    needs: build

    permissions:
      packages: write

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Name the image
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/iam" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=${{ github.event.release.prerelease && 'false' || 'auto' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !github.event.release.prerelease }}

      - name: Tag the multi-architecture image
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done <<< "$TAGS"
          for digest in *; do args+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${args[@]}"

[workspace]

[package]
name = "zerpto_iam"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "iam"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
# What every service shares (HTTP contract, IAM client, events, storage,
# relay). Pinned to a released tag; update by bumping it.
zerpto-core = { git = "https://github.com/zerpto/srv-core", tag = "v0.1.0" }
# The gRPC contracts between services, generated from `com.zerpto.proto`. Pinned
# to a released tag, as `zerpto-core`.
zerpto-proto = { git = "https://github.com/zerpto/contract-proto", tag = "v0.1.0", features = ["reference-data", "iam"] }
# zerpto-core pins the Loco version: keep `version` on the same minor as core's.
# Loco's default features include `db-sqlite` (and mailer, compression); they
# are listed out here without them so SQLite is never compiled. `db-postgres`
# must be listed: without it every Postgres connection fails at runtime.
# `generators` keeps `cargo loco generate` working in debug builds.
loco-rs = { version = "1.3", default-features = false, features = ["auth", "cli", "generators", "with-db", "db-postgres", "cache_inmem", "cache_redis", "worker_redis"] }

[dependencies]
zerpto-core = { workspace = true, features = ["events", "storage", "relay"] }
zerpto-proto = { workspace = true }
loco-rs = { workspace = true  }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
  "sync",
  "time",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
migration = { package = "zerpto-iam-migration", path = "migration" }
sea-orm = { version = "2.0", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
chrono-tz = "0.10"
# v7: every table's `id` is a time-ordered UUIDv7 (see AGENTS.md).
uuid = { version = "1.6", features = ["v4", "v7"] }
# Request validation: `#[derive(Validate)]` on request bodies (with zerpto-core's
# `ValidatedJson` and shared rules).
validator = { version = "0.20", features = ["derive"] }
# ts-rs derives the TypeScript bindings for the response DTOs (the typed JSON
# API contract) that the SPA frontend consumes.
ts-rs = { version = "12", features = ["chrono-impl", "serde-compat"] }
# Reads `.env` at startup (src/bin/main.rs).
dotenvy = "0.15"
# This service's own gRPC server (health comes from zerpto-core).
tonic = "0.14"
# Emailed and phone tokens are stored as SHA-256 hashes.
sha2 = "0.10"
hex = "0.4"
# Extension manifests are YAML, with semantic version ranges.
serde_yaml_ng = "0.10"
semver = "1"
# Google's token check (src/google) and manifest downloads (src/extensions).
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }

[[bin]]
name = "iam"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }

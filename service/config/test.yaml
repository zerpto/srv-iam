# Loco configuration file documentation

# Application logging configuration
logger:
  # Enable or disable logging.
  enable: false
  # Enable pretty backtrace (sets RUST_BACKTRACE=1)
  pretty_backtrace: true
  # Log level, options: trace, debug, info, warn or error.
  level: debug
  # Define the logging format. options: compact, pretty or json
  format: compact
  # By default the logger has filtering only logs that came from your code or logs that came from `loco` framework. to see all third party libraries
  # Uncomment the line below to override to see all third party libraries you can enable this config and override the logger filters.
  # override_filter: trace

# Web server configuration
server:
  # Port on which the server will listen. the server binding is 0.0.0.0:{PORT}
  port: 4001
  # The UI hostname or IP address that mailers will point to.
  host: http://localhost
  # Out of the box middleware configuration. to disable middleware you can changed the `enable` field to `false` of comment the middleware block
  middlewares:
    fallback:
      enable: false

# Worker Configuration
workers:
  # specifies the worker mode. Options:
  #   - BackgroundQueue - Workers operate asynchronously in the background, processing queued.
  #   - ForegroundBlocking - Workers operate in the foreground and block until tasks are completed.
  #   - BackgroundAsync - Workers operate asynchronously in the background, processing tasks with async capabilities.
  mode: ForegroundBlocking

  

# Shared cache: idempotency keys and IAM's sessions (refresh tokens). In memory, so
# tests need no Redis. Without this block Loco's null cache refuses every write.
cache:
  kind: InMem

# Initializers Configuration
# initializers:
#  oauth2:
#    authorization_code: # Authorization code grant type
#      - client_identifier: google # Identifier for the OAuth2 provider. Replace 'google' with your provider's name if different, must be unique within the oauth2 config.
#        ... other fields

# Database Configuration
database:
  # Database connection URI
  uri: <%= get_env(name="DATABASE_URL", default="postgres://loco:loco@localhost:5432/zerpto_iam_test") %>
  # When enabled, the sql query will be logged.
  enable_logging: false
  # Set the timeout duration when acquiring a connection.
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="500") %>
  # Set the idle duration before closing a connection.
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  # Minimum number of connections for a pool.
  min_connections: <%= get_env(name="DB_MIN_CONNECTIONS", default="1") %>
  # Maximum number of connections for a pool.
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="1") %>
  # Run migration up when application loaded
  auto_migrate: true
  # Truncate database when application loaded. This is a dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_truncate: true
  # Recreating schema when application loaded.  This is a dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_recreate: true

# Authentication Configuration. Services only validate tokens; every service
# must use the same secret as the service that issues them.
auth:
  # JWT authentication
  jwt:
    # Secret key for token generation and verification
    secret: <%= get_env(name="JWT_SECRET", default="dev-only-shared-secret-change-me") %>
    # Token expiration time in seconds
    expiration: 604800 # 7 days

# App-specific settings, read with `Settings::load(ctx)`.
settings:
  # This service's name. Names its event stream and subjects.
  service: <%= get_env(name="SERVICE_NAME", default="iam") %>
  # The web app that email links and `web_urls` point to.
  web_app_url: <%= get_env(name="WEB_APP_URL", default="http://localhost:3000") %>
  # The reference-data service, asked to check a tenant's address.
  reference_data_url: "<%= get_env(name="REFERENCE_DATA_GRPC_URL", default="http://localhost:5002") %>"
  # Google sign-in: the OAuth client ID(s), comma-separated. Empty refuses every
  # Google sign-in.
  google:
    client_id: "<%= get_env(name="GOOGLE_CLIENT_ID", default="") %>"
  # The extension registry: the platform operator's key, and the internal hosts
  # a manifest may be fetched from over plain HTTP (comma-separated).
  extensions:
    platform_key: "<%= get_env(name="PLATFORM_API_KEY", default="test-platform-key") %>"
    allowed_hosts: "<%= get_env(name="EXTENSION_ALLOWED_HOSTS", default="localhost,127.0.0.1") %>"
    # No fetching in tests: the compiled-in manifests are enough.
    core_manifest_urls: {}
  # Phone verification codes (sent through the relay service).
  phone:
    code_ttl_minutes: 5
    max_attempts: 5
    max_sends_per_hour: 5
  # gRPC server that other services call.
  grpc:
    enabled: false
    binding: <%= get_env(name="GRPC_BINDING", default="0.0.0.0") %>
    port: <%= get_env(name="GRPC_PORT", default="5001") %>
  # Event streaming over NATS JetStream.
  events:
    enabled: false
    nats_url: nats://localhost:4222
    relay_interval_ms: 500
  # Error reporting. Leave the DSN empty to turn it off.
  sentry:
    dsn: ""
    traces_sample_rate: 0.0
  storage:
    driver: local
    dir: storage
